name: Generate Snake Animation

on:
  schedule:
    # Run automatically every 24 hours at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
      branches:
        - main

  jobs:
    generate:
      permissions:
        contents: write
      runs-on: ubuntu-latest
      timeout-minutes: 10

      steps:
        - name: Generate snake SVG
          uses: Platane/snk@v3
          with:
            github_user_name: ${{ github.repository_owner }}
